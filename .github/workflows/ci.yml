name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo (checkout) and runs tests; no write scope needed.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --console=plain
      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --console=plain
